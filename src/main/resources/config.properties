# Database Configuration
db.url=jdbc:sqlserver://localhost:1433;databaseName=CheckInDB;encrypt=true;trustServerCertificate=true
db.user=sa
db.password=123456
db.pool.size=10
db.pool.maxLifetime=1800000

# Application Configuration
app.name=AEROCHECK - Sistema de Check-In
app.version=1.0.0
app.environment=development

# Logging Configuration
logging.level=INFO
logging.file.path=logs/
logging.file.name=aerocheck.log

# Session Configuration
session.timeout=3600000
session.maxSessions=100

# Audit Configuration
audit.enabled=true
audit.logChanges=true

# SMTP Configuration for Password Recovery
# Para Gmail: usar "App Passwords" en lugar de tu contraseña regular
# Para otros proveedores: usar credenciales SMTP normales
smtp.host=smtp.gmail.com
smtp.port=587
smtp.sender.email=tu-email@gmail.com
smtp.sender.password=tu-contraseña-de-aplicacion
smtp.protocol=TLS
smtp.timeout=5000

# Email Configuration
email.from.name=Sistema AEROCHECK
email.password.reset.subject=Recupera tu contraseña en AEROCHECK
email.password.changed.subject=Tu contraseña ha sido actualizada
