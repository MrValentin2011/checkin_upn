# Database Configuration
db.url=jdbc:sqlserver://localhost:1433;databaseName=CheckInDB;encrypt=true;trustServerCertificate=true
db.user=sa
db.password=123456
db.pool.size=10
db.pool.maxLifetime=1800000

# Application Configuration
app.name=AEROCHECK - Sistema de Check-In
app.version=1.0.0
app.environment=development

# Logging Configuration
logging.level=INFO
logging.file.path=logs/
logging.file.name=aerocheck.log

# Session Configuration
session.timeout=3600000
session.maxSessions=100

# Audit Configuration
audit.enabled=true
audit.logChanges=true
